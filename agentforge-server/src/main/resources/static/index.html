<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentForge - AI Agent 协作平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 背景 -->
    <div class="bg-gradient"></div>
    <div class="bg-orbs">
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
        <div class="bg-orb"></div>
    </div>

    <!-- 页面加载 -->
    <div class="page-loader" id="pageLoader">
        <div class="loader"></div>
    </div>

    <!-- 导航栏 -->
    <nav class="navbar glass-strong">
        <div class="brand">
            <div class="logo"><svg viewBox="0 0 24 24" class="logo-icon" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M8 10v1a4 4 0 0 0 8 0v-1"/><line x1="12" y1="17" x2="12" y2="21"/><circle cx="9" cy="7" r="0.5" fill="currentColor" stroke="none"/><circle cx="15" cy="7" r="0.5" fill="currentColor" stroke="none"/></svg></div>
            <h1>AgentForge <span>AI Agent 协作平台</span></h1>
        </div>
        <div class="status-bar">
            <span class="status">API 在线</span>
            <span class="version">v1.0.0</span>
            <button class="theme-toggle glass-hover" onclick="toggleTheme()" title="切换主题">
                <span class="theme-icon" id="themeIcon"><svg viewBox="0 0 24 24" class="icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
            </button>
        </div>
    </nav>

    <!-- 主体 -->
    <div class="main">
        <!-- 侧边栏 -->
        <div class="sidebar glass">
            <div class="nav-menu">
                <div class="nav-item active glass-ripple" onclick="showPanel('chat', this)">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" class="icon"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
                    <span>对话测试</span>
                </div>
                <div class="nav-item glass-ripple" onclick="showPanel('agents', this)">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" class="icon"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="9" cy="16" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2v6"/><circle cx="12" cy="2" r="1"/></svg></span>
                    <span>Agent 管理</span>
                </div>
                <div class="nav-item glass-ripple" onclick="showPanel('tools', this)">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" class="icon"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
                    <span>工具列表</span>
                </div>
                <div class="nav-item glass-ripple" onclick="showPanel('memory', this)">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" class="icon"><path d="M9.5 2a3.5 3.5 0 0 0-3.2 2.1A3.5 3.5 0 0 0 3 7.5C3 9.4 4.1 11 5.7 11.7A3.5 3.5 0 0 0 5 14.5 3.5 3.5 0 0 0 8.5 18H9"/><path d="M14.5 2a3.5 3.5 0 0 1 3.2 2.1A3.5 3.5 0 0 1 21 7.5c0 1.9-1.1 3.5-2.7 4.2.7.8 1.2 2 1.2 3.3a3.5 3.5 0 0 1-3.5 3.5H15"/><path d="M12 2v16"/></svg></span>
                    <span>记忆系统</span>
                </div>
                <div class="nav-item glass-ripple" onclick="showPanel('create', this)">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" class="icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
                    <span>创建 Agent</span>
                </div>
                <div class="nav-item glass-ripple" onclick="showPanel('events', this)">
                    <span class="nav-icon"><svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></span>
                    <span>事件日志</span>
                </div>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content glass">
            <!-- 对话面板 -->
            <div class="panel active" id="panel-chat">
                <div class="chat-header">
                    <div class="chat-header-left">
                        <h2>对话测试</h2>
                        <select class="agent-select" id="agentSelect">
                            <option value="assistant">🤖 通用助手</option>
                            <option value="researcher">🔍 研究专家</option>
                            <option value="analyst">📊 数据分析师</option>
                            <option value="summarizer">📝 总结专家</option>
                            <option disabled>─── 性格助手 ───</option>
                            <option value="du-she">😏 毒舌助手</option>
                            <option value="wen-rou">🌸 温柔助手</option>
                            <option value="xue-zhe">📚 学者助手</option>
                            <option value="duan-zi-shou">😂 段子手助手</option>
                            <option value="gao-leng">😎 高冷助手</option>
                            <option value="ke-ai">🐱 可爱助手</option>
                            <option value="hua-lao">💬 话痨助手</option>
                            <option value="zhong-yi">🏥 中医助手</option>
                        </select>
                        <div class="session-wrapper">
                            <button class="btn btn-secondary" onclick="toggleSessionList()" title="历史对话">
                                <svg viewBox="0 0 24 24" class="icon icon-sm"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                历史对话
                            </button>
                            <div class="session-list glass-strong" id="sessionList"></div>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-secondary voice-mode-btn" onclick="voiceConv.start()" title="语音对话模式" id="voiceModeBtn">
                            <svg viewBox="0 0 24 24" class="icon icon-sm"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                            语音对话
                        </button>
                        <button class="btn btn-primary" onclick="newConversation()" title="新建对话">
                            <svg viewBox="0 0 24 24" class="icon icon-sm"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            新建对话
                        </button>
                        <button class="btn btn-secondary" onclick="clearChat()">清空对话</button>
                    </div>
                </div>
                <div class="chat-box" id="chatBox">
                    <div class="message agent">
                        <div class="msg-avatar agent"><svg viewBox="0 0 24 24" class="icon"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="9" cy="16" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="16" r="1.5" fill="currentColor" stroke="none"/><path d="M12 2v6"/><circle cx="12" cy="2" r="1"/></svg></div>
                        <div class="msg-content">
                            <div class="msg-bubble">你好！我是 AgentForge AI 助手。

我可以帮你：
•  数学计算
•  查询时间
•  搜索信息
•  处理 JSON
•  字符串处理
•  上传文件分析

请告诉我你需要什么帮助？</div>
                            <div class="msg-meta">Agent · 刚刚</div>
                        </div>
                    </div>
                </div>
                <div class="file-preview-bar" id="filePreviewBar"></div>
                <div class="chat-input" style="position:relative">
                    <input type="file" class="file-input-hidden" id="fileInput" onchange="onFileSelected(this)" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.json,.csv,.xml,.yaml,.yml,.log,.py,.js,.java,.html,.css">
                    <button class="voice-btn" onclick="document.getElementById('fileInput').click()" title="上传文件">
                        <svg viewBox="0 0 24 24" class="icon"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <input type="text" id="userInput" placeholder="输入消息... (按 Enter 发送)" onkeypress="if(event.key==='Enter')sendMessage()">
                    <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">发送</button>
                </div>
            </div>

            <!-- Agent 管理 -->
            <div class="panel" id="panel-agents">
                <div class="panel-header">
                    <h2>Agent 管理</h2>
                </div>
                <div class="panel-body">
                    <div class="agent-grid" id="agentGrid"></div>
                </div>
            </div>

            <!-- 工具列表 -->
            <div class="panel" id="panel-tools">
                <div class="panel-header">
                    <h2>内置工具</h2>
                </div>
                <div class="panel-body">
                    <div class="tool-table-wrapper glass-subtle">
                        <table class="tool-table">
                            <thead><tr><th>工具名称</th><th>描述</th><th>参数</th></tr></thead>
                            <tbody id="toolTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 记忆系统 -->
            <div class="panel" id="panel-memory">
                <div class="panel-header">
                    <h2>记忆系统</h2>
                    <div class="memory-controls">
                        <select class="agent-select" id="memoryAgentSelect" onchange="loadMemory()">
                            <option value="assistant">🤖 通用助手</option>
                            <option value="researcher">🔍 研究专家</option>
                            <option value="analyst">📊 数据分析师</option>
                            <option value="summarizer">📝 总结专家</option>
                            <option value="du-she">😏 毒舌助手</option>
                            <option value="wen-rou">🌸 温柔助手</option>
                            <option value="xue-zhe">📚 学者助手</option>
                            <option value="duan-zi-shou">😂 段子手助手</option>
                            <option value="gao-leng">😎 高冷助手</option>
                            <option value="ke-ai">🐱 可爱助手</option>
                            <option value="hua-lao">💬 话痨助手</option>
                            <option value="zhong-yi">🏥 中医助手</option>
                        </select>
                        <button class="btn btn-secondary" onclick="loadMemory()">刷新</button>
                        <button class="btn btn-secondary" onclick="clearMemory()">清空</button>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="memoryContent">选择 Agent 查看记忆</div>
                </div>
            </div>

            <!-- 创建 Agent -->
            <div class="panel" id="panel-create">
                <div class="panel-header">
                    <h2>创建 Agent</h2>
                </div>
                <div class="panel-body">
                    <div class="form-container">
                        <div class="form-group">
                            <label>Agent 名称</label>
                            <input type="text" id="newAgentName" placeholder="my-agent">
                        </div>
                        <div class="form-group">
                            <label>描述</label>
                            <input type="text" id="newAgentDesc" placeholder="这是一个自定义 Agent">
                        </div>
                        <div class="form-group">
                            <label>系统提示词</label>
                            <textarea id="newAgentPrompt" placeholder="你是一个专业的..."></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>温度 (0-2)</label>
                                <input type="number" id="newAgentTemp" value="0.7" min="0" max="2" step="0.1">
                            </div>
                            <div class="form-group">
                                <label>最大 Token</label>
                                <input type="number" id="newAgentTokens" value="4096">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>可用工具 (按住 Ctrl 多选)</label>
                            <select id="newAgentTools" multiple style="height:140px">
                                <option value="calculate">calculate</option>
                                <option value="http_get">http_get</option>
                                <option value="read_file">read_file</option>
                                <option value="web_search">web_search</option>
                                <option value="baike_search">baike_search</option>
                                <option value="get_current_time">get_current_time</option>
                                <option value="parse_json">parse_json</option>
                                <option value="string_replace">string_replace</option>
                                <option value="regex_match">regex_match</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="createAgent()" style="width:100%;padding:14px">创建 Agent</button>
                        <div id="createResult" style="margin-top:16px"></div>
                    </div>
                </div>
            </div>

            <!-- 事件日志 -->
            <div class="panel" id="panel-events">
                <div class="panel-header">
                    <h2>实时事件日志</h2>
                    <button class="btn btn-secondary" onclick="clearEvents()">清空日志</button>
                </div>
                <div class="panel-body">
                    <div class="event-log" id="eventLog">
                        <div class="empty-state">
                            <div class="empty-state-icon"><svg viewBox="0 0 24 24" class="icon icon-lg"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div>
                            <h3>等待事件...</h3>
                            <p>事件将在这里实时显示</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 语音对话浮层 -->
    <div class="voice-overlay" id="voiceOverlay">
        <div class="voice-overlay-content">
            <div class="voice-ring-container">
                <div class="voice-ring voice-ring-1"></div>
                <div class="voice-ring voice-ring-2"></div>
                <div class="voice-ring voice-ring-3"></div>
                <div class="voice-center-icon" id="voiceCenterIcon">🎤</div>
            </div>
            <div class="voice-status-label" id="voiceStatusLabel">准备就绪</div>
            <div class="voice-transcript-box" id="voiceTranscript"></div>
            <div class="voice-reply-box" id="voiceReply"></div>
            <div class="voice-speed-selector">
                <button class="voice-speed-btn" data-rate="0.8" onclick="voiceConv.setRate(0.8)">0.8x</button>
                <button class="voice-speed-btn active" data-rate="1.0" onclick="voiceConv.setRate(1.0)">1.0x</button>
                <button class="voice-speed-btn" data-rate="1.2" onclick="voiceConv.setRate(1.2)">1.2x</button>
                <button class="voice-speed-btn" data-rate="1.5" onclick="voiceConv.setRate(1.5)">1.5x</button>
            </div>
            <div class="voice-controls">
                <button class="voice-ctrl-btn stop-btn" onclick="voiceConv.stop()" title="停止对话">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" fill="none" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                <button class="voice-ctrl-btn" onclick="voiceConv.close()" title="关闭语音模式">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
